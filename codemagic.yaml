workflows:
  pulse-ios:
    name: Pulse iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: iOS dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Configure iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.tufan.pulsegame" --type IOS_APP_DEVELOPMENT --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-codesign
          xcode-project build-ipa \
            --project ios/Runner.xcodeproj \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa