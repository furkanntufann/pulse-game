workflows:
  pulse-ios:
    name: Pulse iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.tufan.pulsegame

    scripts:
      - name: Resolve Flutter deps
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Configure signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.tufan.pulsegame" --type IOS_APP_DEVELOPMENT --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Create export options
        script: |
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" | head -n1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "Provisioning profile bulunamadi"
            exit 1
          fi
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          TEAM_ID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract TeamIdentifier.0 raw -)
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tufan.pulsegame</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=/tmp/ExportOptions.plist
          mkdir -p artifacts/ios
          find build -type f -name "*.ipa" -exec cp {} artifacts/ios/ \;
          ls -la artifacts/ios
          test -n "$(ls -1 artifacts/ios/*.ipa 2>/dev/null)" || { echo "IPA uretilmedi"; exit 1; }

    artifacts:
      - artifacts/ios/*.ipa
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  pulse-android:
    name: Pulse Android
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Resolve Flutter deps
        script: flutter pub get
      - name: Build Android bundle and apk
        script: |
          flutter build appbundle --release
          flutter build apk --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk