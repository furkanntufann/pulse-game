workflows:
  pulse-ios:
    name: Pulse iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      # Apple Distribution sertifikasi + App Store profili Codemagic UI'dan yuklenmeli.
      # fetch-signing-files --create API 403 veriyorsa bu yol kullanilir.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tufan.pulsegame

    scripts:
      - name: Resolve Flutter deps
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Configure signing files
        script: |
          set -e
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Create export options
        script: |
          PROFILE_PATH=""
          for p in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -f "$p" ] || continue
            if ! security cms -D -i "$p" 2>/dev/null | plutil -extract ProvisionedDevices raw - >/dev/null 2>&1; then
              PROFILE_PATH="$p"
              break
            fi
          done
          if [ -z "$PROFILE_PATH" ]; then
            echo "App Store provisioning profile bulunamadi"
            exit 1
          fi
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          TEAM_ID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract TeamIdentifier.0 raw -)
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tufan.pulsegame</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=/tmp/ExportOptions.plist
          mkdir -p artifacts/ios
          find build -type f -name "*.ipa" -exec cp {} artifacts/ios/ \;
          ls -la artifacts/ios
          test -n "$(ls -1 artifacts/ios/*.ipa 2>/dev/null)" || { echo "IPA uretilmedi"; exit 1; }

    artifacts:
      - artifacts/ios/*.ipa
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
    integrations:
      app_store_connect: Pulse

  pulse-android:
    name: Pulse Android
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: com.tufan.pulsegame
        CM_KEY_ALIAS: upload

    scripts:
      - name: Resolve Flutter deps
        script: flutter pub get

      - name: Set up Android signing
        script: |
          set -e
          if [ -z "${CM_KEYSTORE:-}" ]; then
            echo "HATA: Codemagic -> Environment variables -> grup keystore_credentials"
            echo "CM_KEYSTORE (base64 jks), CM_KEYSTORE_PASSWORD, CM_KEY_PASSWORD tanimlayin."
            echo "Bkz. PLAY-STORE.md"
            exit 1
          fi
          KEYSTORE_PATH="${CM_KEYSTORE_PATH:-/tmp/upload-keystore.jks}"
          echo "$CM_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release
          flutter build apk --release
          ls -la build/app/outputs/bundle/release/
          ls -la build/app/outputs/flutter-apk/
          if jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab 2>&1 | grep -q "CN=Android Debug"; then
            echo "HATA: AAB debug imzali — keystore ayarlarini kontrol edin."
            exit 1
          fi
          echo "Release imzasi dogrulandi."

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/app-release.apk

    # Otomatik Play yukleme icin PLAY-STORE.md "Bolum 5" + google_play_credentials grubu
    # publishing:
    #   google_play:
    #     credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true