workflows:
  pulse-ios:
    name: Pulse iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: development
        bundle_identifier: com.tufan.pulsegame
    scripts:
      - name: iOS dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Configure iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.tufan.pulsegame" --type IOS_APP_DEVELOPMENT --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --export-method development
          mkdir -p artifacts/ios
          shopt -s globstar nullglob
          for f in build/ios/ipa/*.ipa build/ios/**/*.ipa; do
            cp "$f" artifacts/ios/
          done
          ls -la artifacts/ios
          test -n "$(ls -1 artifacts/ios/*.ipa 2>/dev/null)" || { echo "IPA uretilmedi"; exit 1; }

    artifacts:
      - artifacts/ios/*.ipa
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive