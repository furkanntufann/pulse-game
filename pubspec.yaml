name: nabiz
description: Ripple Rush — genişleyen halkalara tam vuruş yap, combo kur. Hyper-casual zamanlama oyunu.
publish_to: "none"
version: 1.0.0+17

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: store-assets/app-icon-1024.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
